# Local development only. Production runs on Railway.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: angel
      POSTGRES_PASSWORD: angel
      POSTGRES_DB: angel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U angel -d angel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
